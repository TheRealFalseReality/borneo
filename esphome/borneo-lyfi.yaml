# ESPHome Configuration for Borneo Aquarium LED Controller
# Converted from ESP-IDF firmware
# Hardware: BLC06MK1 (ESP32-C3 based)
# Features: 6-channel PWM LED control with thermal management

substitutions:
  device_name: borneo-lyfi
  friendly_name: "Borneo Aquarium LED"
  # Hardware version
  hw_version: "1.0.0"
  
  # LED PWM Configuration
  pwm_frequency: "19000 Hz"  # 19kHz PWM frequency from ESP-IDF config
  
  # LED Channel GPIOs (from BLC06MK1 board config)
  led_ch0_gpio: "5"   # Red channel
  led_ch1_gpio: "4"   # Green channel  
  led_ch2_gpio: "3"   # Blue channel
  led_ch3_gpio: "19"  # Warm White channel
  led_ch4_gpio: "18"  # UV/Purple channel
  led_ch5_gpio: "10"  # Cool White channel
  
  # Fan Control GPIOs
  fan_pwm_gpio: "7"   # Fan PWM control
  fan_vreg_gpio: "6"  # Fan voltage regulator control
  
  # Status Indicator
  indicator_gpio: "8"
  
  # NTC Thermistor (ADC channel 2)
  ntc_adc_gpio: "2"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Borneo Aquarium LED Controller with 6-channel PWM"
  
  # Project information
  project:
    name: "borneo-iot.lyfi"
    version: ${hw_version}

# ESP32 platform configuration
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

# Captive portal for WiFi configuration
captive_portal:

# Web server for standalone control
web_server:
  port: 80

# Time component for sunrise/sunset automation
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "UTC"
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"

# Sun component for sunrise/sunset tracking
sun:
  latitude: !secret latitude
  longitude: !secret longitude

# Status LED indicator
status_led:
  pin:
    number: ${indicator_gpio}
    inverted: false

# I2C bus (if needed for future sensors)
# i2c:
#   sda: GPIO_SDA
#   scl: GPIO_SCL
#   scan: true

# ADC configuration for temperature and power monitoring
# Note: ESP32-C3 uses ADC1
sensor:
  # NTC Thermistor for temperature monitoring
  - platform: resistance
    id: ntc_resistance
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 4.7kOhm  # Pull-up resistor from config
    name: "NTC Resistance"
    disabled_by_default: true
    
  - platform: adc
    id: ntc_source
    pin: GPIO${ntc_adc_gpio}
    attenuation: 12db
    update_interval: 1s
    filters:
      - multiply: 3.3  # ADC voltage reference
    internal: true
    
  - platform: ntc
    sensor: ntc_resistance
    id: board_temperature
    name: "Board Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      # Standard NTC thermistor calibration
      # These values should be adjusted based on actual thermistor specs
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  # WiFi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    icon: "mdi:wifi"

  # Uptime sensor
  - platform: uptime
    name: "Uptime"
    icon: "mdi:clock-outline"

# Text sensors
text_sensor:
  # ESPHome version
  - platform: version
    name: "ESPHome Version"
    icon: "mdi:information-outline"
  
  # WiFi info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip-network"
    ssid:
      name: "Connected SSID"
      icon: "mdi:wifi"
    mac_address:
      name: "MAC Address"
      icon: "mdi:network"

# Binary sensors
binary_sensor:
  # Status indicator
  - platform: status
    name: "Status"
    icon: "mdi:heart-pulse"

# PWM outputs for LED channels
output:
  # LED Channel 0 - Red
  - platform: ledc
    id: led_ch0_output
    pin: ${led_ch0_gpio}
    frequency: ${pwm_frequency}
    
  # LED Channel 1 - Green
  - platform: ledc
    id: led_ch1_output
    pin: ${led_ch1_gpio}
    frequency: ${pwm_frequency}
    
  # LED Channel 2 - Blue
  - platform: ledc
    id: led_ch2_output
    pin: ${led_ch2_gpio}
    frequency: ${pwm_frequency}
    
  # LED Channel 3 - Warm White
  - platform: ledc
    id: led_ch3_output
    pin: ${led_ch3_gpio}
    frequency: ${pwm_frequency}
    
  # LED Channel 4 - UV/Purple
  - platform: ledc
    id: led_ch4_output
    pin: ${led_ch4_gpio}
    frequency: ${pwm_frequency}
    
  # LED Channel 5 - Cool White
  - platform: ledc
    id: led_ch5_output
    pin: ${led_ch5_gpio}
    frequency: ${pwm_frequency}
  
  # Fan PWM control
  - platform: ledc
    id: fan_pwm_output
    pin: ${fan_pwm_gpio}
    frequency: 25000 Hz  # 25kHz for fan control
    
  # Fan voltage regulator control
  - platform: ledc
    id: fan_vreg_output
    pin: ${fan_vreg_gpio}
    frequency: 25000 Hz

# Light entities for LED channels
light:
  # Individual channel controls
  - platform: monochromatic
    name: "LED Channel 0 (Red)"
    id: led_ch0
    output: led_ch0_output
    default_transition_length: 1s
    gamma_correct: 0  # We'll apply correction in automation
    icon: "mdi:led-strip"
    
  - platform: monochromatic
    name: "LED Channel 1 (Green)"
    id: led_ch1
    output: led_ch1_output
    default_transition_length: 1s
    gamma_correct: 0
    icon: "mdi:led-strip"
    
  - platform: monochromatic
    name: "LED Channel 2 (Blue)"
    id: led_ch2
    output: led_ch2_output
    default_transition_length: 1s
    gamma_correct: 0
    icon: "mdi:led-strip"
    
  - platform: monochromatic
    name: "LED Channel 3 (Warm White)"
    id: led_ch3
    output: led_ch3_output
    default_transition_length: 1s
    gamma_correct: 0
    icon: "mdi:led-strip"
    
  - platform: monochromatic
    name: "LED Channel 4 (UV/Purple)"
    id: led_ch4
    output: led_ch4_output
    default_transition_length: 1s
    gamma_correct: 0
    icon: "mdi:led-strip"
    
  - platform: monochromatic
    name: "LED Channel 5 (Cool White)"
    id: led_ch5
    output: led_ch5_output
    default_transition_length: 1s
    gamma_correct: 0
    icon: "mdi:led-strip"

# Fan control
fan:
  - platform: speed
    id: cooling_fan
    name: "Cooling Fan"
    output: fan_pwm_output
    icon: "mdi:fan"

# Number inputs for manual control and settings
number:
  # Individual channel brightness controls (0-4095 matching ESP-IDF LED_BRIGHTNESS_MAX)
  - platform: template
    name: "Manual CH0 Brightness"
    id: manual_ch0_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
    
  - platform: template
    name: "Manual CH1 Brightness"
    id: manual_ch1_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
    
  - platform: template
    name: "Manual CH2 Brightness"
    id: manual_ch2_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
    
  - platform: template
    name: "Manual CH3 Brightness"
    id: manual_ch3_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
    
  - platform: template
    name: "Manual CH4 Brightness"
    id: manual_ch4_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
    
  - platform: template
    name: "Manual CH5 Brightness"
    id: manual_ch5_brightness
    min_value: 0
    max_value: 4095
    step: 1
    initial_value: 0
    optimistic: true
    icon: "mdi:brightness-6"
  
  # Thermal management settings
  - platform: template
    name: "Target Temperature"
    id: target_temperature
    min_value: 20
    max_value: 60
    step: 0.5
    initial_value: 40
    unit_of_measurement: "°C"
    optimistic: true
    icon: "mdi:thermometer"
    
  # PID tuning parameters
  - platform: template
    name: "PID Kp"
    id: pid_kp
    min_value: 0
    max_value: 100
    step: 0.1
    initial_value: 10.0
    optimistic: true
    icon: "mdi:tune"
    
  - platform: template
    name: "PID Ki"
    id: pid_ki
    min_value: 0
    max_value: 10
    step: 0.01
    initial_value: 0.5
    optimistic: true
    icon: "mdi:tune"
    
  - platform: template
    name: "PID Kd"
    id: pid_kd
    min_value: 0
    max_value: 10
    step: 0.01
    initial_value: 1.0
    optimistic: true
    icon: "mdi:tune"

# Select for LED modes
select:
  # LED control mode (Manual, Scheduled, Sun simulation)
  - platform: template
    name: "LED Control Mode"
    id: led_mode
    optimistic: true
    options:
      - "Manual"
      - "Scheduled"
      - "Sun Simulation"
    initial_option: "Manual"
    icon: "mdi:lightbulb-auto"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("led_mode", "Mode changed to: %s", x.c_str());
  
  # Brightness correction method
  - platform: template
    name: "Brightness Correction"
    id: correction_method
    optimistic: true
    options:
      - "Linear"
      - "Logarithmic"
      - "Exponential"
      - "Gamma"
      - "CIE1931"
    initial_option: "Exponential"
    icon: "mdi:chart-bell-curve"

# Switches
switch:
  # Enable/disable features
  - platform: template
    name: "Enable Sun Simulation"
    id: sun_simulation_enabled
    optimistic: true
    icon: "mdi:white-balance-sunny"
    
  - platform: template
    name: "Enable Acclimation Mode"
    id: acclimation_enabled
    optimistic: true
    icon: "mdi:chart-timeline-variant"
    
  - platform: template
    name: "Enable Thermal Control"
    id: thermal_control_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:thermometer-auto"
    
  - platform: template
    name: "Enable Cloud Effects"
    id: cloud_effects_enabled
    optimistic: true
    icon: "mdi:weather-partly-cloudy"

  # Restart switch
  - platform: restart
    name: "Restart"
    icon: "mdi:restart"

# Intervals for periodic tasks
interval:
  # Thermal controller update (every second)
  - interval: 1s
    then:
      - script.execute: thermal_controller
      
  # LED update task (matches LED_UPDATE_PERIOD_US: 10ms)
  - interval: 10ms
    then:
      - script.execute: led_update_task

# Scripts
script:
  # Main LED update task (runs every 10ms like ESP-IDF)
  - id: led_update_task
    mode: single
    then:
      - lambda: |-
          // Update LED channels based on current mode and settings
          // This replaces the led_render_task() from ESP-IDF
          
          auto mode = id(led_mode).state;
          
          if (mode == "Manual") {
            // Manual mode: use manual brightness values
            float ch0 = id(manual_ch0_brightness).state / 4095.0;
            float ch1 = id(manual_ch1_brightness).state / 4095.0;
            float ch2 = id(manual_ch2_brightness).state / 4095.0;
            float ch3 = id(manual_ch3_brightness).state / 4095.0;
            float ch4 = id(manual_ch4_brightness).state / 4095.0;
            float ch5 = id(manual_ch5_brightness).state / 4095.0;
            
            // Apply brightness correction if needed
            auto correction = id(correction_method).state;
            // TODO: Implement correction methods
            
            id(led_ch0).set_level(ch0);
            id(led_ch1).set_level(ch1);
            id(led_ch2).set_level(ch2);
            id(led_ch3).set_level(ch3);
            id(led_ch4).set_level(ch4);
            id(led_ch5).set_level(ch5);
          }
          else if (mode == "Sun Simulation") {
            // Sun simulation mode: calculate brightness based on solar altitude
            // This is handled by Home Assistant automations in production
          }
          // Scheduled mode is handled by Home Assistant automations
  
  # Thermal controller (PID-based fan control)
  - id: thermal_controller
    mode: single
    then:
      - lambda: |-
          if (!id(thermal_control_enabled).state) {
            return;
          }
          
          // Simple PID implementation for fan control
          static float integral = 0;
          static float prev_error = 0;
          
          float current_temp = id(board_temperature).state;
          float target_temp = id(target_temperature).state;
          
          if (isnan(current_temp)) {
            return;
          }
          
          float error = current_temp - target_temp;
          integral += error;
          float derivative = error - prev_error;
          prev_error = error;
          
          // PID coefficients
          float kp = id(pid_kp).state;
          float ki = id(pid_ki).state;
          float kd = id(pid_kd).state;
          
          // Calculate PID output
          float output = kp * error + ki * integral + kd * derivative;
          
          // Clamp output to 0-100%
          if (output < 0) output = 0;
          if (output > 100) output = 100;
          
          // Integral windup protection
          if (output == 100 || output == 0) {
            integral -= error;  // Undo integral accumulation
          }
          
          // Set fan speed (0-100%)
          if (output > 5) {  // Minimum threshold to start fan
            auto call = id(cooling_fan).turn_on();
            call.set_speed(output);
            call.perform();
          } else {
            id(cooling_fan).turn_off();
          }
          
          ESP_LOGD("thermal", "Temp: %.1f°C, Target: %.1f°C, Error: %.2f, Fan: %.1f%%", 
                   current_temp, target_temp, error, output);

# Buttons for actions
button:
  # Factory reset
  - platform: template
    name: "Factory Reset"
    icon: "mdi:restore"
    on_press:
      then:
        - logger.log: "Factory reset requested"
        # In production, this would clear NVS and restart
        
  # Save settings
  - platform: template
    name: "Save Settings"
    icon: "mdi:content-save"
    on_press:
      then:
        - logger.log: "Settings saved"
        # In production, this would save to NVS/flash

